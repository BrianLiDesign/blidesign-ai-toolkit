name: Verify marketplace

on:
  pull_request:
  push:
    branches: [main, stable]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run project verification with evidence
        run: python plugins/toolkit-workflows/skills/project-check/scripts/project_check.py --root . --run --report "${{ runner.temp }}/project-check.json"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: project-check-${{ matrix.os }}
          path: ${{ runner.temp }}/project-check.json
          if-no-files-found: warn
          retention-days: 7
      - name: Dry-run skill sync
        run: python scripts/sync_skills.py --profile development --target "${{ runner.temp }}/synced-skills" --dry-run
      - name: Dry-run portable MCP sync
        run: python scripts/sync_mcps.py --host cursor --profile development --config "${{ runner.temp }}/mcp-preview.json" --runtime-root "${{ runner.temp }}/mcp-runtime" --dry-run
      - name: Check Bash syntax
        if: runner.os != 'Windows'
        run: bash -n scripts/bootstrap.sh
      - name: Dry-run Bash development profile
        if: runner.os != 'Windows'
        run: bash scripts/bootstrap.sh --profile development --dry-run --skip-external
      - name: Dry-run PowerShell development profile
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -Profile development -DryRun -SkipExternal
